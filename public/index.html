<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Downloader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <header>
      <div class="logo">
        <span class="logo-icon">▶</span>
        <h1>Media<span class="accent">DL</span></h1>
      </div>
      <p class="subtitle">Tải video &amp; audio từ TikTok, YouTube và hơn thế nữa</p>
    </header>

    <main>
      <div class="input-group">
        <input
          type="url"
          id="urlInput"
          placeholder="Dán Link video vào đây..."
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <div class="btn-row">
        <button id="btnMp4" class="btn btn-mp4" type="button">
          <span class="btn-icon">🎬</span>
          Tải Video
        </button>
        <button id="btnMp3" class="btn btn-mp3" type="button">
          <span class="btn-icon">🎵</span>
          Tải Sound
        </button>
      </div>

      <div id="progressWrap" class="progress-wrap hidden">
        <div class="progress-info">
          <span id="progressLabel">Đang tải...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>

      <div id="status" class="status"></div>
    </main>

    <footer>
      <p>Độc quyền từ Kietynho · Deploy on Vercel</p>
    </footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
